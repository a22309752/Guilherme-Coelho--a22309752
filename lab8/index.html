<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Loja Online</title>
</head>
<body>
    <header>
        <h3>Q-press</h3>
        <div>
            <a href="#colecao">Coleção</a>
            <a href="#cesto">Carrinho</a>

        </div>
    </header>

    <main>
        <section id="colecao">
            <h1>Produtos</h1>
            <div>
                <select name="Filtrar" id="filtro">
                    <option value="">Todas as categorias</option>
                </select>
                <input id="searchbar" type="search" placeholder="Search">
                <select name="Ordenar" id="ordenar">
                    <option id="default" value="">Padrão</option>
                    <option id="asc" value="asc">Preço crescente</option>
                    <option id ="desc" value="desc">Preço decrescente</option>
                </select>
            </div>

            <div id="produtos"></div>
        </section>
    </main>

    <aside>
        <section id="cesto">
            <h1>Carrinho</h1>
            <div></div>
        </section>

        <section id="checkout">
            <h2 id="custoTotal">Custo total: 0.00 €</h2>

            <form>
                <input type="text" id="nome" placeholder="Nome" required>

                <p>
                    És estudante do DEISI?
                    <input id="estudante" type="checkbox">
                </p>

                <p>
                    Cupão de desconto:
                    <input id="cupao" type="text">
                </p>

                <button type="submit">Comprar</button>
            </form>

            <h3 id="valorFinal"></h3>
            <p id="referenciaPagamento"></p>
        </section>
    </aside>

    <footer>
        <p>DIW 2026/27- Lusófona</p>
    </footer>

    <script src="main.js"></script>

</body>
</html>
