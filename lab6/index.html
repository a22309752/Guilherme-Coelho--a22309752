<!DOCTYPE html>
<html lang="en">
<head>

    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h2>Coleção de Cromos</h2>
    </header>
    <main>

        <section id="colecao">
            <h1>A minha coleção</h1>
            <ul></ul>
            <h3>Total de cromos: <span>0</span></h3>
        </section>

        <section id="repetidos">
            <h1>Cromos Repetidos</h1>
            <ul></ul>
            <h3>Total de cromos repetidos: <span>0</span></h3>
        </section>

        <section>
            <h1>Adiciona novos cromos</h1>
            <form action="">
                <input id="number" type="number" placeholder="Número" >
                <input id="submit" type="submit" value="Registrar Cromo" autofocus>
            </form>
        </section>

    </main>
    <footer>
        <p>DIW 2026 Lusófona</p>
    </footer>
    <script src="main.js"></script>
</body>
</html>
