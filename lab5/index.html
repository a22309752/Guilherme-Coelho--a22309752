<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section>
        <h2>Passa o rato por cima</h2>

    </section>


    <section id="titulo-cor">
        <h2>Pinta-me usando os botões abaixo</h2>
        <div>
            <button class="color" data-color="Red">Red</button>
            <button class="color" data-color="Green">Green</button>
            <button class="color" data-color="Blue">Blue</button>
        </div>
    </section>


    <section>
        <h2>Escreve e vê o que acontece</h2>
    </section>


    <section>
        <h2>Escolhe a cor do fundo</h2>
        <select id="cores">
            <option value="white">Branco</option>
            <option value="purple">Roxo</option>
            <option value="blue">Azul</option>
        </select>
    </section>


    <section>
        <h2>Usa o botão abaixo para contar</h2>
        <button id="conta">Contar</button>
        <span id="contador">0</span>
    </section>


    <section>
        <h2>Preenche este formulário</h2>
        <form id="formulario" action="">
            <input id="nome" type="text" placeholder="Insira o seu nome">
            <input id="idade" type="text" placeholder="Insira a sua idade">
            <button>Submit</button>
            <p id="texto"></p>
        </form>
    </section>


    <section id="relogio">
        <h2>Segundos que esteve nesta página: <span>0</span></h2>
    </section>

    <script src="scripts/main.js"></script>
</body>
</html>
